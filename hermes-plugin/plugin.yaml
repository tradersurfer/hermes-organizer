manifest_version: 2
api_version: 1
name: hermes-organizer
version: 0.1.1
description: Hermes Organizer — index, OCR/vision-classify, and propose renames for unstructured Google Drive files, then rename and move them only after the owner's per-item approval, with verification and rollback. Scan -> propose -> approve -> execute -> verify. Read-only by default; nothing is renamed, moved, or deleted without an approvals file whose hashes match the proposals. v0.1.1 adds the live dashboard pane and target-aware dedup (proposals check the destination folder's live filenames). v0.1.0 was the fresh public start (the core tool is v0.7.0 in the same repo).
author: tradersurfer93
license: MIT
requires_hermes: ">=0.21.6"
tags: [files, drive, organization, ocr, vision]
provides_tools:
  - organizer_scan
  - organizer_propose
  - organizer_approve
  - organizer_execute
  - organizer_verify
  - organizer_rollback
  - organizer_report
python_dependencies:
  - "pydantic>=2.0,<3"
  - "rapidocr-onnxruntime>=1.3,<2"
requires_env:
  - CLOUDFLARE_API_TOKEN
  - CLOUDFLARE_ACCOUNT_ID
  - GEMINI_API_KEY
config_schema:
  vision_provider: {type: str, default: "cloudflare", label: "Vision provider", description: "cloudflare (default) or gemini. Vision is a second opinion only — OCR-only scanning works with no credentials at all."}
  approval_required: {type: bool, default: true, label: "Require owner approval for renames/moves", description: "When true (default), organizer_execute refuses without an approvals file whose hashes match the proposals. Do not disable."}
  confidence_threshold: {type: str, default: "0.60", label: "Confidence threshold (locked)", description: "Shown for transparency. Locked at 0.60 and not user-lowerable — the classifier uses 0.60 whatever this says. Files below 0.60 go to human review."}
